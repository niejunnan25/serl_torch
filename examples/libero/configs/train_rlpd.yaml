global_seed: 0
libero_root: null
libero_config_dir: null
libero_datasets_root: null

task:
  suite_name: libero_10
  task_id: 8

runtime:
  role: actor
  trainer_host: 127.0.0.1
  trainer_port: 5688
  broadcast_port: 5689
  data_store_queue_size: 2000
  trainer_transport:
    mode: sync_commit
    data_port: 5690
    control_timeout_ms: 2000
    data_queue_capacity: 8
    data_socket_hwm: 8
    commit_poll_ms: 20
    wait_committed_on_episode_end: false
    wait_committed_on_shutdown: true

wandb:
  project: libero
  exp_name: ${task.suite_name}_task_${task.task_id}_rlpd
  group: rlpd
  debug: false

env:
  action_dim: 7
  backend: remote
  resolution: 256
  num_steps_wait: 10
  max_episode_steps: null
  seed: 7
  remote:
    host: 127.0.0.1
    port: 30000
    timeout_sec: 180.0

obs:
  image_keys: [image, wrist_image]
  vector_obs_keys: [robot_proprio]
  stack_horizon: 1

encoder:
  type: resnet
  shared: true
  use_proprio: true
  proprio_latent_dim: 64
  resnet:
    model_name: /home/hello/codebase/serl_torch/pretrained_models/microsoft--resnet-18
    pretrained: true
    freeze_backbone: true
    pooling_method: spatial_learned_embeddings
    num_spatial_blocks: 8
    bottleneck_dim: 256

network:
  policy_hidden_dims: [256, 256]
  critic_hidden_dims: [256, 256]
  policy_activation: tanh
  critic_activation: tanh
  policy_layer_norm: true
  critic_layer_norm: true

sac:
  learning_rate: 3.0e-4
  std_min: 1.0e-5
  std_max: 5.0
  discount: 0.96
  soft_target_update_rate: 0.005
  temperature_init: 1.0e-2
  backup_entropy: false
  critic_ensemble_size: 10
  critic_subsample_size: 2
  utd_ratio: 1
  otf_num_samples: 1
  cql_n_actions: 10
  cql_temperature: 1.0
  optimizer:
    type: adam
    weight_decay: 0.0
    temperature_weight_decay: null
    warmup_steps: null
    cosine_decay_steps: null
    grad_clip_norm: null

replay:
  capacity: 250000
  batch_size: 256

offline:
  enabled: true
  prepared_path: data/rlpd/offline_data/libero_10_task_8/direct_image-wrist_image_proprio
  ratio: 0.5
  capacity: 50000
  load_max_episodes: null
  load_max_transitions: null
  pretrain_steps: 0

  prepare:
    raw_dataset_path: null
    output_root: data/rlpd/offline_data

training:
  training_starts: 200
  random_steps: 300
  steps_per_update: 30
  critic_actor_ratio: 4
  max_env_steps: 300000
  max_update_steps: 300000
  log_period: 100
  mixed_precision:
    enabled: true
    dtype: bfloat16
  torch_compile:
    enabled: false
    target: actor_critic
    backend: inductor
    mode: default
    fullgraph: true
    dynamic: false
  checkpoint:
    every_steps: 2500
    keep: 0
    dir: checkpoints
  async_eval:
    enabled: false
    every_episodes: 20
    episodes: 10
    start_episode_idx: 0
    max_env_steps_per_episode: null
    deterministic: true
    poll_interval_sec: 5.0
    queue_file: async_eval_queue.jsonl
    summary_jsonl: async_eval_results.jsonl
    worker_log_file: async_eval_worker.log
    checkpoint:
      dir: async_eval_checkpoints
      keep: 0
    env:
      backend: remote
      remote:
        host: 127.0.0.1
        port: 30010
        timeout_sec: 180.0

logging:
  summary_file: summary.json

launch:
  output_root: outputs/libero_rlpd

hydra:
  run:
    dir: ${launch.output_root}/${hydra:job.config_name}/${now:%Y-%m-%d_%H-%M-%S}
