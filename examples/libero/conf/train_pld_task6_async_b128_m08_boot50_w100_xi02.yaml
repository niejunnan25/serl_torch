defaults:
  - train_pld_task6
  - _self_

residual:
  xi: 0.2

openpi:
  port: 32358

env:
  remote:
    port: 31358

replay:
  batch_size: 128

offline:
  dataset_paths: []
  bootstrap_base:
    enabled: true
    success_episodes: 50
    max_seed_attempts: 20000
    seed_base: 7
    max_env_steps_per_episode: null
    only_success: true

training:
  warmup_base_episodes: 100
  async:
    enabled: true
  calql_pretrain:
    batch_size: 128
  async_eval:
    enabled: true
    env_port: 31458
  checkpoint_dir: artifacts/checkpoints

logging:
  step_log_file: logs/step_logs.jsonl
  episode_log_file: logs/episode_logs.jsonl
  summary_file: logs/summary.json

hydra:
  run:
    dir: outputs/libero/pld_matrix/task6_async_b128/m08_boot50_w100_xi02/${now:%Y-%m-%d}/${now:%H-%M-%S}
