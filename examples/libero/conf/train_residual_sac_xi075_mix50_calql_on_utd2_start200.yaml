defaults:
  - train_residual_sac
  - _self_

residual:
  xi: 0.75

openpi:
  port: 32003

env:
  remote:
    port: 31003

offline:
  symmetric_replay: true
  ratio: 0.5

sac:
  utd_ratio: 2

training:
  training_starts: 200
  max_online_env_steps: 50000
  calql_pretrain:
    enabled: true
    steps: 2000
    batch_size: 128
    alpha: 1.0
    n_actions: 10
    temperature: 1.0

hydra:
  run:
    dir: outputs/libero/train_residual_sac_xi075_mix50_calql_on_utd2_start200/${now:%Y-%m-%d}/${now:%H-%M-%S}
