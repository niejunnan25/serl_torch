defaults:
  - train_pld_task2_m06_boot50_w100_xi05
  - _self_

openpi:
  port: 32802

env:
  remote:
    port: 31802

training:
  max_online_env_steps: 300000
  warmup_base_episodes: 100
  warmup_base_steps: 30000
  enable_base_probing: true
  probing_alpha: 0.2
  probing_min_steps: 0
  probing_max_steps: 0
  async:
    enabled: true
    update_frequency: 20
    idle_sleep_sec: 0.002
  residual_scale_scheduler:
    enabled: true
    type: linear
    min_scale: 0.1
    warmup_steps: 30000
    anneal_steps: 70000
  xi_scheduler:
    enabled: true
    type: linear
    min_xi: 0.05
    warmup_steps: 30000
    anneal_steps: 70000
  async_eval:
    enabled: true
    env_port: 31902

hydra:
  run:
    dir: outputs/libero/pld_matrix/task2/m06_boot50_w100_xi05_sched300k/${now:%Y-%m-%d}/${now:%H-%M-%S}
