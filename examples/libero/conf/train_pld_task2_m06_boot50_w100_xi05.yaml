defaults:
  - train_pld_task6
  - _self_

task:
  task_id: 2

residual:
  xi: 0.5

openpi:
  port: 32602

env:
  remote:
    port: 31602

offline:
  dataset_paths: []
  bootstrap_base:
    enabled: true
    success_episodes: 50
    max_seed_attempts: 20000
    seed_base: 7
    max_env_steps_per_episode: null
    only_success: true

training:
  warmup_base_episodes: 100
  async_eval:
    enabled: true
    env_port: 31702
  checkpoint_dir: artifacts/checkpoints

logging:
  step_log_file: logs/step_logs.jsonl
  episode_log_file: logs/episode_logs.jsonl
  summary_file: logs/summary.json

hydra:
  run:
    dir: outputs/libero/pld_matrix/task2/m06_boot50_w100_xi05/${now:%Y-%m-%d}/${now:%H-%M-%S}
