defaults:
  - train_pld_task6
  - _self_

residual:
  xi: 0.5

openpi:
  port: 32351

env:
  remote:
    port: 31351

replay:
  batch_size: 128

offline:
  dataset_paths:
    - data/offline/libero_10_task_6
  bootstrap_base:
    enabled: false

training:
  max_online_env_steps: 300000
  warmup_base_episodes: 0
  warmup_base_steps: 0
  warmup_separate: true
  enable_base_probing: false
  probing_alpha: null
  probing_min_steps: 0
  probing_max_steps: 0
  async:
    enabled: true
  xi_scheduler:
    enabled: true
    type: linear
    min_xi: 0.05
    warmup_steps: 0
    anneal_steps: 90000
  calql_pretrain:
    batch_size: 128
  async_eval:
    enabled: true
    env_port: 31451
  checkpoint_dir: artifacts/checkpoints

logging:
  step_log_file: logs/step_logs.jsonl
  episode_log_file: logs/episode_logs.jsonl
  summary_file: logs/summary.json

hydra:
  run:
    dir: outputs/libero/pld_matrix/task6_async_b128/m01_expert_w0_xi05/${now:%Y-%m-%d}/${now:%H-%M-%S}
