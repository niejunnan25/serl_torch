defaults:
  - train_residual_sac
  - _self_

seed: 7

task:
  task_id: 6
  seed_base: 7

residual:
  # PLD appendix recommendation for LIBERO single-arm tasks.
  xi: 0.5
  action_dim: 7
  control_gripper: true
  gripper_delta_limit: 1.0

openpi:
  port: 32340

env:
  remote:
    port: 31340

replay:
  # PLD Appendix Table 5
  batch_size: 256

offline:
  # Align with PLD Stage-1: use successful base-policy rollouts for offline warm-start.
  # Keep this empty and let bootstrap_base collect 50 successful trajectories online.
  dataset_paths: []
  symmetric_replay: true
  ratio: 0.5
  bootstrap_base:
    enabled: true
    success_episodes: 50
    max_seed_attempts: 20000
    seed_base: 7
    max_env_steps_per_episode: null
    only_success: true

sac:
  # PLD Appendix Table 5
  utd_ratio: 2
  learning_rate: 3.0e-4
  soft_target_update_rate: 0.005
  temperature_init: 1.0
  critic_ensemble_size: 2
  critic_subsample_size: 2

training:
  # PLD Section 4.1: 250k online interaction steps.
  max_online_env_steps: 300000

  # PLD Appendix Table 5
  warmup_base_episodes: 100
  warmup_base_steps: 0
  training_starts: 200
  # Enable actor-learner decoupling to improve wall-clock throughput.
  # Update-frequency in [1, 500] is generally robust in PLD ablations; use 20 to
  # reduce sync overhead while keeping policy staleness modest.
  async:
    enabled: true
    update_frequency: 20
    idle_sleep_sec: 0.002

  # Stage-1 only (specialist RL): disable probing-based state initialization.
  # Probing is mainly used for PLD Stage-2 data collection / distribution shaping.
  enable_base_probing: false
  probing_alpha: null
  probing_min_steps: 0
  probing_max_steps: 0

  checkpoint_period: 5000

  async_eval:
    enabled: true
    every_steps: 5000
    episodes: 50
    seed_base: 1000000
    seed_stride: 10000
    fixed_seed: null
    expert_check: false
    deterministic: true
    residual_scale: 1.0
    max_seed_attempts: 5000
    enable_base_probing: false
    probing_alpha: null
    probing_min_steps: 0
    probing_max_steps: 0
    env_host: 127.0.0.1
    env_port: 31440
    reuse_openpi_port: true
    queue_policy: all

  calql_pretrain:
    enabled: true
    steps: 2000
    batch_size: 256
    alpha: 1.0
    n_actions: 10
    temperature: 1.0

  phases:
    - name: residual_rl
      episodes: 10000
      residual_scale: 1.0
      train: true

hydra:
  run:
    dir: outputs/libero/train_residual_sac_task6_pld_paper_aligned/${now:%Y-%m-%d}/${now:%H-%M-%S}
