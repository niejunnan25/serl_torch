defaults:
  - train_residual_sac
  - _self_

task:
  task_id: 6

residual:
  xi: 0.05
  action_dim: 7
  control_gripper: true
  gripper_delta_limit: 2.0

openpi:
  port: 32324

env:
  remote:
    port: 31324

offline:
  dataset_paths:
    - data/offline/libero_10_task_6
  symmetric_replay: true
  ratio: 0.5

sac:
  utd_ratio: 2

training:
  warmup_base_episodes: 0
  training_starts: 200
  max_online_env_steps: 100000
  checkpoint_period: 5000
  async_eval:
    enabled: true
    every_steps: 5000
    episodes: 50
    env_host: 127.0.0.1
    env_port: 31424
    reuse_openpi_port: true
    queue_policy: all
  calql_pretrain:
    enabled: true
    steps: 2000
    batch_size: 128
    alpha: 1.0
    n_actions: 10
    temperature: 1.0

hydra:
  run:
    dir: outputs/libero/train_residual_sac_task6_matrix_xi005_grip2/${now:%Y-%m-%d}/${now:%H-%M-%S}
