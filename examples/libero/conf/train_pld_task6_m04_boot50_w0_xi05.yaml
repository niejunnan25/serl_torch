defaults:
  - train_pld_task6
  - _self_

residual:
  xi: 0.5

openpi:
  port: 32344

env:
  remote:
    port: 31344

offline:
  dataset_paths: []
  bootstrap_base:
    enabled: true
    success_episodes: 50
    max_seed_attempts: 20000
    seed_base: 7
    max_env_steps_per_episode: null
    only_success: true

training:
  warmup_base_episodes: 0
  async_eval:
    enabled: true
    env_port: 31444
  checkpoint_dir: artifacts/checkpoints

logging:
  step_log_file: logs/step_logs.jsonl
  episode_log_file: logs/episode_logs.jsonl
  summary_file: logs/summary.json

hydra:
  run:
    dir: outputs/libero/pld_matrix/task6/m04_boot50_w0_xi05/${now:%Y-%m-%d}/${now:%H-%M-%S}
