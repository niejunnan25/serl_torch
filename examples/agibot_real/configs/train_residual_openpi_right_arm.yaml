defaults:
  - train_residual
  - _self_

task:
  name: office_setting
  task_key: office_setting
  prompt: The right arm picks up the white mouse from the desk and places the mouse on the black mouse pad
  hz: 15.0

policy:
  type: openpi
  host: 127.0.0.1
  port: 30001
  id: pi05_task_3463_3540_mouse_only_right_hand_camera_position_15hz
